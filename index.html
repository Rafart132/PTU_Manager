<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('ptu-theme'); } catch {}
        const dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crea tu entrenador y su Pokémon inicial, consulta requisitos y planifica tus clases en PTU 1.05." />
    <meta name="theme-color" content="#196b70" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Cuaderno de entrenadores · PTU 1.05</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Activa JavaScript para crear y guardar tu ficha de entrenador.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
